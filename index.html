<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#155eef">
  <title>Sistema AEE</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; font-family: Arial, sans-serif; background: #f4f7fb; }
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .bar { min-height: 48px; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #155eef; color: white; }
    .bar strong { font-size: 15px; }
    .bar a { color: white; font-size: 13px; }
    .frame-wrap { flex: 1; min-height: calc(100vh - 48px); }
    iframe { display: block; width: 100%; height: calc(100vh - 48px); min-height: 620px; border: 0; background: white; }
    .fallback { padding: 20px; text-align: center; color: #475467; font-size: 14px; }
    .fallback a { color: #155eef; font-weight: bold; }
  </style>
</head>
<body>
  <header class="bar">
    <strong>Sistema AEE — Gestão de atendimentos</strong>
    <a href="https://script.google.com/macros/s/AKfycbxiOTz3LIwFxctLBaJzEeulMEi4rAZlOK_I29-v51CC-Yi9qnZvZHZeEYlEBmsK5oHxjA/exec" target="_blank" rel="noopener">Abrir em nova aba</a>
  </header>
  <main class="frame-wrap">
    <iframe
      src="https://script.google.com/macros/s/AKfycbxiOTz3LIwFxctLBaJzEeulMEi4rAZlOK_I29-v51CC-Yi9qnZvZHZeEYlEBmsK5oHxjA/exec"
      title="Sistema AEE"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
    <noscript>
      <div class="fallback">Ative o JavaScript ou <a href="https://script.google.com/macros/s/AKfycbxiOTz3LIwFxctLBaJzEeulMEi4rAZlOK_I29-v51CC-Yi9qnZvZHZeEYlEBmsK5oHxjA/exec">abra o Sistema AEE diretamente</a>.</div>
    </noscript>
  </main>
</body>
</html>
